name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (no DB required)
        env:
          KALSHI_KEY_ID: ""
          KALSHI_PRIVKEY_PATH: ""
          DB_PASS: ""
          LOG_LEVEL: "WARNING"
        run: |
          python -m pytest tests/ \
            -q \
            --tb=short \
            --ignore=tests/test_synthesis_integration.py \
            -x
        # -x: stop on first failure so CI feedback is fast

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pytest_cache/
          retention-days: 7
